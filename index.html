<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Palamis</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      background: #060810;
      color: #f0ede8;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    .bg {
      position: fixed;
      inset: 0;
      background-image: url('Palamis_Website_Image.png');
      background-size: cover;
      background-position: center right;
      z-index: 0;
    }

    /* very subtle overlay — image is already dark */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(5, 7, 12, 0.45);
    }

    header {
      position: fixed;
      top: 0;
      left: 0;
      padding: 36px 48px;
      z-index: 10;
    }

    .wordmark {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f0ede8;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding-top: 33vh;
      padding-left: 25%;
      padding-right: 48px;
      padding-bottom: 120px;
      position: relative;
      z-index: 10;
      min-height: 100vh;
    }

    .tagline {
      font-size: clamp(1.65rem, 2.8vw, 2.25rem);
      font-weight: 300;
      line-height: 1.4;
      letter-spacing: -0.01em;
      color: #f0ede8;
      margin-bottom: 16px;
      white-space: nowrap;
    }

    .contact {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.04em;
      /* color: #7a8a9a; */
      color: #a8b8c8; 
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .contact:hover {
      color: #c8d8e8;
    }

    @media (max-width: 768px) {
      header {
        padding: 24px;
      }

      main {
        padding-left: 24px;
        padding-right: 24px;
        padding-top: 20vh;
        padding-bottom: 80px;
        align-items: center;
        justify-content: flex-start;
        text-align: center;
        min-height: 100vh;
      }

      .tagline {
        white-space: normal;
        font-size: clamp(1.2rem, 5vw, 1.6rem);
        text-wrap: balance;
      }

      .contact {
        font-size: 15px;
      }

      /* shift image so the robot arm stays visible on narrow screens */
      .bg {
        background-position: 80% center;
      }

      /* slightly darker overlay on mobile for readability */
      .bg::after {
        background: rgba(5, 7, 12, 0.62);
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <header>
    <span class="wordmark">Palamis</span>
  </header>

  <main>
    <p class="tagline">Physical intelligence, built for the real world.</p>
    <a href="mailto:team@palamis.ai" class="contact">team@palamis.ai</a>
  </main>
</body>
</html>
